name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  release:
    name: Verify and publish tagged release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev]"

      - name: Verify tag matches project version
        shell: python
        run: |
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Tag {actual_tag!r} does not match project version {version!r}")

      - name: Run tests
        run: python -m pytest

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Run Ruff lint
        run: python -m ruff check src tests

      - name: Run mypy
        run: python -m mypy

      - name: Build source and wheel distributions
        run: python -m build

      - name: Smoke-test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/kingdirstat-wheel"
          "$RUNNER_TEMP/kingdirstat-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/kingdirstat-wheel/bin/python" "$GITHUB_WORKSPACE/tests/installed_smoke.py"

      - name: Record distribution hashes and exact source
        shell: python
        run: |
          import hashlib
          import pathlib
          import subprocess

          dist = pathlib.Path("dist")
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          (dist / "SOURCE_COMMIT.txt").write_text(source + "\n", encoding="utf-8")
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}" for p in sorted(dist.iterdir()) if p.is_file()]
          (dist / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Upload distributions to this workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kingdirstat-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --notes-file docs/RELEASE_NOTES-2.1.1.md
          --prerelease
          --title "KingDirSTAT ${GITHUB_REF_NAME#v}"
