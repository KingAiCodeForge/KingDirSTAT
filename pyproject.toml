[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "kingdirstat"
version = "2.1.1"
description = "A modern, non-destructive disk usage analyser with a treemap GUI and automation-friendly CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "KingAI Code Forge" }]
keywords = ["disk-usage", "treemap", "filesystem", "windows", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Filesystems",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
kingdirstat = "kingdirstat.cli:main"
kingdirstat-gui = "kingdirstat.gui_launcher:main"

[project.urls]
Homepage = "https://github.com/KingAiCodeForge/KingDirSTAT"
Issues = "https://github.com/KingAiCodeForge/KingDirSTAT/issues"
Source = "https://github.com/KingAiCodeForge/KingDirSTAT"

[tool.hatch.build.targets.wheel]
packages = ["src/kingdirstat"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/docs",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src/kingdirstat"]
strict = true
warn_unreachable = true
